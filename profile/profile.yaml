# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Developed a Linux cluster monitoring agent for the Jarvis Linux Cluster Administration (LCA) team that collects hardware specifications and real-time resource usage, including CPU and memory metrics, from Rocky Linux server nodes. Stored collected data in a PostgreSQL database to enable querying, reporting, and historical analysis for capacity planning and cluster scaling decisions. Delivered the project as a minimum viable product (MVP) to support performance tracking and data-driven infrastructure planning.
  - name: "Python Data Analytics"
    git_url: "/python_data_analytics"
    description: "Developed a data analytics proof of concept (PoC) for London Gift Shop (LGS), a UK-based online giftware retailer, to analyze customer purchasing behavior and support data-driven sales and marketing decisions. Processed and analyzed historical transaction data using Python, Jupyter Notebook, Pandas, and NumPy, performing data cleaning, aggregation, and exploratory analysis. Delivered actionable insights on product performance, customer trends, and seasonality to enable targeted marketing campaigns and revenue growth initiatives."


